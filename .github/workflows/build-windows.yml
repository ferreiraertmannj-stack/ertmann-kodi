name: EMC Windows Build (C++)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Configure CMake (Visual Studio 2022)
      run: |
        cd kodi-source
        mkdir build
        cd build
        cmake -G "Visual Studio 17 2022" -A x64 ..
      
    - name: Build Kodi (.exe)
      run: |
        cd kodi-source/build
        cmake --build . --config Release

    - name: Upload Windows Executable
      uses: actions/upload-artifact@v4
      with:
        name: Ertmann-Media-Center-Windows
        path: |
          kodi-source/build/Release/*.exe
          kodi-source/build/Release/system/
          kodi-source/build/Release/addons/
