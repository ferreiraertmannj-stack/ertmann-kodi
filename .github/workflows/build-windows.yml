name: EMC Windows Build (C++)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup vcpkg and install dependencies
      run: |
        git clone --depth 1 https://github.com/microsoft/vcpkg.git vcpkg
        .\vcpkg\bootstrap-vcpkg.bat
        $maxRetries = 3
        $retryCount = 0
        while ($retryCount -lt $maxRetries) {
          try {
            .\vcpkg\vcpkg.exe install libxml2:x64-windows libass:x64-windows libxslt:x64-windows libudfread:x64-windows pkgconf:x64-windows
            break
          } catch {
            $retryCount++
            if ($retryCount -ge $maxRetries) { throw $_ }
            Write-Host "Retry attempt $retryCount..."
            Start-Sleep -Seconds 10
          }
        }
      shell: powershell

    - name: Configure CMake (Visual Studio 2022) with vcpkg toolchain
      run: |
        cd kodi-source
        mkdir -Force build
        cd build
        $vcpkg = (Resolve-Path '..\..\vcpkg\scripts\buildsystems\vcpkg.cmake').Path
        cmake -G "Visual Studio 17 2022" -A x64 -DCMAKE_TOOLCHAIN_FILE="$vcpkg" -DVCPKG_TARGET_TRIPLET="x64-windows" ..
      shell: powershell
      
    - name: Build Kodi (.exe)
      run: |
        cd kodi-source/build
        cmake --build . --config Release

    - name: Upload Windows Executable
      uses: actions/upload-artifact@v4
      with:
        name: Ertmann-Media-Center-Windows
        path: |
          kodi-source/build/Release/*.exe
          kodi-source/build/Release/system/
          kodi-source/build/Release/addons/
