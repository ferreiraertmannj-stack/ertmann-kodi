name: Android APK Build (Ertmann Media Center)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: false
        default: 'v1.0.0'

jobs:
  build-android:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Android SDK and NDK
      uses: android-actions/setup-android@v3

    # Install Kodi build dependencies for Ubuntu (cross-compilation requirements)
    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential automake autoconf gawk gperf default-jre unzip cmake curl libcurl4-openssl-dev zlib1g-dev default-jdk

    # Build Kodi for Android
    - name: Build Kodi (Ertmann Fork) for Android
      run: |
        # Kodi uses a custom CMake cross-compilation toolchain for Android.
        # This executes the official build step for APK generation based on kodi-source.
        cd kodi-source/tools/depends
        chmod +x bootstrap
        ./bootstrap
        chmod +x configure || true
        ./configure --with-tarballs=/tmp/tarballs --host=aarch64-linux-android --with-sdk-path=$ANDROID_SDK_ROOT --with-ndk-path=$ANDROID_NDK_ROOT --prefix=$(pwd)/xbmc-depends
        make -j$(nproc)
        cd ../../
        make -j$(nproc) apk
      
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Ertmann-Media-Center-Android
        path: kodi-source/tools/android/packaging/xbmc/build/outputs/apk/debug/*.apk

    # Publish to Github Releases if triggered manually
    - name: Create Release
      if: github.event_name == 'workflow_dispatch'
      uses: softprops/action-gh-release@v1
      with:
        files: kodi-source/tools/android/packaging/xbmc/build/outputs/apk/debug/*.apk
        tag_name: ${{ github.event.inputs.version }}
        name: Ertmann Media Center ${{ github.event.inputs.version }}
