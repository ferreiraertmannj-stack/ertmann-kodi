name: Android APK Build (Ertmann Media Center)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: false
        default: 'v1.0.0'

jobs:
  build-android:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Android SDK and NDK
      uses: android-actions/setup-android@v3

    # Install Kodi build dependencies for Ubuntu (cross-compilation requirements)
    - name: Install System Dependencies
      run: |
        sudo apt-get update && sudo apt-get install -y build-essential cmake curl default-jdk git gperf libbz2-dev libcurl4-openssl-dev libsqlite3-dev libssl-dev nasm python3-dev python3-pil swig unzip zip zlib1g-dev liblzma-dev ccache

    - name: Setup Compiler Cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.ccache
          kodi-source/tools/depends/xbmc-depends
        key: ${{ runner.os }}-kodi-android-depends-${{ hashFiles('kodi-source/tools/depends/**/*.txt', 'kodi-source/tools/depends/**/*.mk') }}
        restore-keys: |
          ${{ runner.os }}-kodi-android-depends-

    # Build Kodi for Android
    - name: Build Kodi (Ertmann Fork) for Android
      run: |
        # Kodi uses a custom CMake cross-compilation toolchain for Android.
        # This executes the official build step for APK generation based on kodi-source.
        cd kodi-source/tools/depends
        chmod +x bootstrap
        ./bootstrap
        chmod +x configure || true
        export CFLAGS="-Wno-int-conversion"
        export CXXFLAGS="-Wno-int-conversion"
        
        # 1. Primeiro, constroi as dependências nativas com o compilador do sistema (sem flags do host)
        ./configure --with-tarballs=/tmp/tarballs --prefix=$(pwd)/xbmc-depends --with-render-system=gl
        make -j$(nproc) native/.installed-x86_64-linux-native || (echo "Native build failed! Exibindo as ultimas 300 linhas:" && tail -n 300 config.log && exit 1)
        
        # 2. Depois, reconfigura para o cross-compile do Android
        ./configure --with-tarballs=/tmp/tarballs --host=aarch64-linux-android --with-sdk-path=$ANDROID_SDK_ROOT --with-ndk-path=$ANDROID_NDK_ROOT --prefix=$(pwd)/xbmc-depends --with-render-system=gles
        make -j$(nproc) || (echo "Cross-compilation failed! Exibindo as ultimas 300 linhas:" && tail -n 300 config.log && exit 1)
        
        cd ../../
        make -j$(nproc) apk
      
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Ertmann-Media-Center-Android
        path: kodi-source/tools/android/packaging/xbmc/build/outputs/apk/debug/*.apk

    # Publish to Github Releases if triggered manually
    - name: Create Release
      if: github.event_name == 'workflow_dispatch'
      uses: softprops/action-gh-release@v1
      with:
        files: kodi-source/tools/android/packaging/xbmc/build/outputs/apk/debug/*.apk
        tag_name: ${{ github.event.inputs.version }}
        name: Ertmann Media Center ${{ github.event.inputs.version }}
